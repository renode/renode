name: Renode CI

on:
  - push
  - pull_request

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt -qqy update &> /dev/null
          sudo apt -qqy install cmake build-essential &> /dev/null

      - name: Clone repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: .github/workflows/global.json

      - name: Setup Dotnet artifacts
        run: |
          ln -s .github/workflows/global.json global.json

      - name: Build Renode
        run: ./build.sh

      - name: Register dotnet-format problem matcher
        run: |
          echo "::add-matcher::.github/workflows/problem-matcher.json"

      - name: Run format check
        id: format_check
        continue-on-error: true
        run: |
          # 'lib' directory contains external dependencies as submonules. They should not be formatted using Renode rules.
          dotnet format ./Renode.sln --exclude lib --verify-no-changes --severity warn

      - name: Generate formatting guide
        if: steps.format_check.outcome == 'failure'
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          Your code does not conform to the repository's code style rules.

          Please run `dotnet format ./Renode.sln --exclude lib` to fix discrepancies.
          EOF
          exit 1
