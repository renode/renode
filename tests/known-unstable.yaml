# This is an example of the format used by renode-test's --unstable argument.

# Test cases can be omitted to treat all cases as unstable.
- tests/peripherals/AK09918.robot

# You can also specify which test cases are unstable.
- tests/example.robot:
    - Should Print Help

# Optional reasons do not affect which tests are unstable.
- tests/whole-suite.robot:
    reason: "Intermittent networking failures"

- tests/selected-tests.robot:
    # A suite-level reason is not allowed when only some test cases are unstable.
    - Should Boot:
        reason: "Occasional UART timeout"
    - Should Respond To Ping:
        reason: "Intermittent packet loss"
